apiVersion: v1
kind: Pod
metadata:
  name: config-file-pod
spec:
  containers:
  - name: test-container
    image: busybox
    command: ["sh", "-c", "cat /etc/config/app.conf && sleep 3600"]
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  volumes:
  - name: config-volume
    configMap:
      name: app-config
