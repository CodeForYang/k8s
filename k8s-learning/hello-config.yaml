---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-config
data:
  HELLO_TEXT: "你好，Kubernetes！"
  HELLO_BG_COLOR: "#4CAF50"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-config-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-config
  template:
    metadata:
      labels:
        app: hello-config
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:latest
          args:
            - -text="$(HELLO_TEXT)"
          ports:
            - containerPort: 5678
          envFrom:
            - configMapRef:
                name: hello-config
---
apiVersion: v1
kind: Service
metadata:
  name: hello-config-svc
spec:
  selector:
    app: hello-config
  ports:
    - port: 80
      targetPort: 5678
  type: NodePort