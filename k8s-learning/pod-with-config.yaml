apiVersion: v1
kind: Pod
metadata:
  name: config-pod
spec:
  containers:
  - name: test-container
    image: busybox
    command: ["sh", "-c", "env | grep APP_ && sleep 3600"]
    envFrom:
    - configMapRef:
        name: app-config
    env:
    - name: APP_MODE
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: APP_MODE